<link id="manifestLink" rel="manifest">
<style>
:root{
  --ink:#4a2735; --ink-soft:#a8768a; --rose:#e8456f; --rose-deep:#c9305a;
  --card-1:#ffb3c4; --card-2:#f2607f; --peach:#ff8e72; --lav:#8b6bf0; --line:#ffdbe6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(820px 420px at 50% -6%, #ffffff 0%, rgba(255,255,255,0) 60%),
    radial-gradient(600px 380px at 100% 8%, rgba(200,175,255,.28) 0%, rgba(200,175,255,0) 70%),
    linear-gradient(180deg,#fff7f9 0%, #ffeef3 46%, #fff7f0 100%);
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
  touch-action:manipulation;
}
body::before{
  content:"";position:fixed;left:-14%;top:14%;width:62vw;height:62vw;max-width:400px;max-height:400px;
  background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,0));
  pointer-events:none;z-index:0;
}
button{font-family:inherit;cursor:pointer}
.app{
  position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) 15px calc(96px + env(safe-area-inset-bottom));
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:4px 0 8px}
.topbar h1{
  margin:0;flex:1 1 auto;min-width:0;text-align:center;
  font-size:clamp(19px,6.1vw,25px);font-weight:900;line-height:1.2;
  letter-spacing:-.05em;white-space:nowrap;color:#d6365f;
  text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.85),0 6px 14px rgba(232,69,111,.24);
}
.topbar h1 .hh{
  color:#ff7d9e;font-weight:900;font-size:.92em;vertical-align:.02em;padding:0 .02em;
  text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.85),0 6px 14px rgba(255,125,158,.35);
}
.topright{display:flex;gap:5px;align-items:center}
.iconbtn{
  width:35px;height:35px;flex:0 0 auto;border-radius:12px;border:none;background:#fff;
  box-shadow:0 4px 12px rgba(214,110,140,.18);color:#e0678a;display:grid;place-items:center;padding:0;
  transition:transform .1s;
}
.iconbtn:active{transform:scale(.93)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.off{color:#d7b7c4}
.spacer{width:35px;height:35px;flex:0 0 auto}

main{flex:1;display:flex;flex-direction:column;min-height:0}
.playview{display:flex;flex-direction:column;flex:1;min-height:0}
.board{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;padding-top:2px}
.mascots{
  display:flex;justify-content:center;align-items:flex-end;gap:3px;
  margin:0 0 2px;position:relative;z-index:0;pointer-events:none;
}
.mascot{width:100px;height:106px;filter:drop-shadow(0 8px 12px rgba(190,110,140,.22))}
.mascot.cat{width:92px;height:98px;margin-bottom:1px}
.bob{animation:bob 3.4s ease-in-out infinite}
.bob2{animation:bob 3.9s ease-in-out .35s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mascots[data-mood="happy"] .mascot{animation:hop .55s ease}
.mascots[data-mood="sad"] .mascot{animation:tremble .5s ease}
.mascots[data-mood="confused"] .mascot{animation:tilt .7s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-13px) rotate(-3deg)}70%{transform:translateY(-4px)}}
@keyframes tremble{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}70%{transform:rotate(5deg)}}

.face{display:none}
.mascots[data-mood="idle"] .face-idle,
.mascots[data-mood="happy"] .face-happy,
.mascots[data-mood="confused"] .face-confused,
.mascots[data-mood="sad"] .face-sad{display:block}
.sparkle{opacity:0}
.mascots[data-mood="happy"] .sparkle{opacity:1;animation:twinkle .9s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

.statusbar{
  position:relative;z-index:1;background:#fff;border-radius:99px;
  box-shadow:0 10px 24px rgba(214,110,140,.18);display:grid;grid-template-columns:1fr 1fr 1fr;
  padding:9px 4px;margin-bottom:7px;
}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;min-width:0}
.stat+.stat::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:#fbe6ee}
.statlabel{font-size:10px;color:#bd93a5;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.stat b{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap}
.stat b.hot{color:#e8456f}
.stat b.low{color:#d42a2a}

.progress{height:7px;border-radius:99px;background:#ffe2ea;overflow:hidden;margin:0 2px 9px;box-shadow:inset 0 1px 2px rgba(200,90,130,.14)}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb3c6,#ff6b8b);transition:width .18s linear}
.progress i.time{background:linear-gradient(90deg,#ffd166,#ff8e72)}
.progress i.time.low{background:linear-gradient(90deg,#ff8f8f,#e8352f)}

.mission{
  align-self:center;display:inline-flex;align-items:center;gap:8px;
  padding:6px 15px 7px;border-radius:16px;color:#fff;margin-bottom:9px;
  box-shadow:0 8px 18px -8px rgba(150,70,110,.45), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .16s;
}
.mission.m-ink{background:linear-gradient(135deg,#b08bff 0%,#7c5cf2 100%)}
.mission.m-word{background:linear-gradient(135deg,#ffc14d 0%,#ff922b 100%)}
.mission .mico{font-size:19px;line-height:1}
.mission .mtxt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.mission .mtxt b{font-size:15px;font-weight:900;letter-spacing:-.03em;white-space:nowrap}
.mission .mtxt i{font-style:normal;font-size:10px;font-weight:800;opacity:.9;letter-spacing:-.02em;white-space:nowrap}
.mission.flip{animation:flipIn .5s ease}
@keyframes flipIn{0%{transform:scale(.86) rotate(-3deg);opacity:.3}55%{transform:scale(1.06) rotate(1.5deg)}100%{transform:scale(1) rotate(0);opacity:1}}

.card{
  position:relative;display:flex;flex-direction:column;
  flex:1 1 auto;min-height:132px;max-height:284px;
  background:linear-gradient(165deg,var(--card-1) 0%,var(--card-2) 58%,#ef5877 100%);
  border-radius:28px;padding:13px;color:#fff;
  box-shadow:0 20px 36px -12px rgba(240,100,135,.55), inset 0 2px 0 rgba(255,255,255,.35);
  overflow:hidden;
  transition:transform .12s;
}
.card::after{
  content:"";position:absolute;left:-30%;right:-30%;bottom:-62%;height:72%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.16),rgba(255,255,255,0));
  pointer-events:none;
}
.card.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
.card.pop{animation:pop .38s ease}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}

.promptbox{
  position:relative;z-index:2;display:grid;place-items:center;flex:1 1 auto;min-height:118px;
  background:linear-gradient(180deg,#ffffff 0%,#fffaf2 100%);
  border-radius:21px;border:1.5px solid rgba(255,255,255,.95);
  box-shadow:inset 0 -3px 0 rgba(240,190,205,.42), inset 0 2px 0 #fff, 0 8px 16px rgba(160,60,90,.18);
  padding:8px 6px;
}
.promptword{
  display:block;font-weight:900;font-size:clamp(56px,19.4vw,84px);line-height:1.08;
  letter-spacing:-.04em;transition:transform .1s;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.07);
}
.promptword.c-red{color:#D42A2A}
.promptword.c-blue{color:#1D4ED8}
.promptword.c-yellow{color:#BF8300}
.promptword.c-green{color:#16884A}
.promptword.c-purple{color:#7A34C9}
.promptword.c-orange{color:#D9530B}

.feedback{
  min-height:19px;text-align:center;font-size:12.5px;font-weight:800;line-height:1.35;
  color:#b0839a;padding:6px 4px 0;letter-spacing:-.02em;
}
.feedback.ok{color:#0e8c4a}
.feedback.bad{color:#d43a4a}

.answers{display:grid;gap:8px;margin-top:9px}
.ansbtn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:7px;
  height:52px;border-radius:17px;border:2px solid #fff;background:#fff;
  box-shadow:0 5px 0 #ffd3df, 0 10px 18px -8px rgba(214,110,140,.35);
  padding:0 6px;transition:transform .07s, box-shadow .07s, background .15s, border-color .15s;
  min-width:0;
}
.ansbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #ffd3df}
.ansbtn .chip{
  width:19px;height:19px;flex:0 0 auto;border-radius:50%;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.85), 0 0 0 1px rgba(30,50,110,.16);
}
.ansbtn .aname{font-size:16.5px;font-weight:900;color:#4a2735;letter-spacing:-.03em;white-space:nowrap}
.ansbtn.ok{background:#e9fbf1;border-color:#38c98a;box-shadow:0 5px 0 #b7ebd1}
.ansbtn.no{background:#fff0f2;border-color:#ff8fa0;box-shadow:0 5px 0 #ffd2d9;animation:shake .4s ease}
.ansbtn.reveal{border-color:#ffbe2e;box-shadow:0 0 0 3px rgba(255,190,46,.35), 0 5px 0 #ffe1a3}
.ansbtn[disabled]{opacity:.85}

.resultview{padding-top:2px;display:flex;flex-direction:column;justify-content:center;flex:1 1 auto}
.resultcard{background:#fff;border-radius:28px;padding:16px 16px 18px;box-shadow:0 20px 44px -16px rgba(214,110,140,.38);text-align:center}
.resultmascots{display:flex;justify-content:center;margin:-2px 0 0}
.resultmascots .mascot{width:78px;height:72px}
.resultcard h2{margin:4px 0 0;font-size:21px;font-weight:900;letter-spacing:-.03em}
.resultcard .sub{margin:3px 0 0;font-size:12px;color:#b0839a;font-weight:800}
.stars{font-size:29px;letter-spacing:4px;margin:6px 0 4px;color:#ffcf47;line-height:1}
.stars i{font-style:normal;display:inline-block;text-shadow:0 2px 0 rgba(230,170,20,.25)}
.stars i.off{color:#f3e6ec;text-shadow:none}
.stars i.on{animation:starPop .5s ease backwards}
.stars i.on:nth-child(2){animation-delay:.1s}
.stars i.on:nth-child(3){animation-delay:.2s}
@keyframes starPop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1) rotate(0);opacity:1}}

.resultStats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 6px}
.resultStats div{background:#fff2f6;border-radius:14px;padding:8px 4px}
.resultStats span{display:block;font-size:10.5px;color:#bd93a5;font-weight:800;margin-bottom:2px}
.resultStats b{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bestline{margin:5px 0 0;font-size:12px;color:#a8768a;font-weight:800;min-height:17px}
.bestline .new{display:inline-block;margin-left:6px;background:#fff0d6;color:#c9761c;border-radius:99px;padding:2px 8px;font-size:10.5px;font-weight:900}
.resultButtons{display:grid;gap:8px;margin-top:12px}
.btn{border:none;border-radius:16px;height:49px;font-size:15.5px;font-weight:900;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff0f5;color:#d93a63}
.btn.solid{background:linear-gradient(160deg,#ff8fa8,#f2607f);color:#fff;box-shadow:0 5px 0 #c9305a}
.btn.solid:active{box-shadow:0 2px 0 #c9305a;transform:translateY(3px)}
.btn.share{background:#fff;color:#d93a63;border:2px solid #ffdbe6}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow.solo{grid-template-columns:1fr}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,214,230,.9);
  padding:6px 7px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px rgba(214,110,140,.1);
}
.tabs{display:flex;gap:2px;width:100%;max-width:480px;margin:0 auto}
.tab{flex:1 1 0;min-width:0;border:none;background:none;border-radius:14px;padding:4px 0 5px;display:flex;flex-direction:column;align-items:center;gap:0;color:#bb92a4;font-weight:800;position:relative}
.tab .tn{font-size:15px;font-weight:900;line-height:1.1}
.tab .tl{font-size:9px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab .mark{position:absolute;top:0;right:calc(50% - 21px);font-size:9.5px;line-height:1;color:#ffb72b}
.tab.active{background:linear-gradient(180deg,#fff1f5,#ffe0ea);color:#d6365f}
.tab.active .tl{color:#c4677f}

.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.spark{position:absolute;width:9px;height:9px;animation:fall 1.3s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx,0),70vh) rotate(520deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(74,39,53,.94);color:#fff;padding:10px 17px;border-radius:99px;
  font-size:12.5px;font-weight:800;z-index:50;max-width:88vw;text-align:center;
  box-shadow:0 10px 24px rgba(90,30,55,.28);animation:toastIn .18s ease;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

.pausemask{position:fixed;inset:0;z-index:40;background:rgba(74,39,53,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:26px}
.pausecard{background:#fff;border-radius:24px;padding:22px 26px;text-align:center;box-shadow:0 24px 50px rgba(120,50,80,.3);width:100%;max-width:290px}
.pausecard p{margin:0 0 3px;font-size:18px;font-weight:900}
.pausecard span{display:block;font-size:12px;color:#b0839a;font-weight:700;margin-bottom:15px}
.pausecard .btn{width:100%}

@media (max-height:720px){
  .mascots{margin-bottom:1px}
  .mascot{width:84px;height:89px}
  .mascot.cat{width:78px;height:83px}
  .card{max-height:236px}
  .promptbox{min-height:96px}
  .promptword{font-size:clamp(46px,15.4vw,66px)}
  .ansbtn{height:46px}
  .statusbar{padding:7px 4px}
}
@media (max-width:360px){
  .app{padding-left:12px;padding-right:12px}
  .tab .tl{font-size:8.5px}
  .ansbtn .aname{font-size:15.5px}
  .mission .mtxt b{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="spacer"></div>
    <h1><span class="hh">♡</span>왕전초 눈치왕!<span class="hh">♡</span></h1>

              <path d="M53 93.6c2.8 7 11.2 7 14 0z" fill="#4a3a2a"/>

<script>
(function () {
  'use strict';

  /* ---------- colors ----------
     Every colour is a dark-enough tone of its hue so the word stays clearly
     readable on the white prompt box (contrast 3:1 or more on #ffffff), and the
     answer chip uses exactly the same tone a child sees in the word. */
  var COLORS = [
    { id: 'red', name: '빨강', hex: '#D42A2A' },
    { id: 'blue', name: '파랑', hex: '#1D4ED8' },
    { id: 'yellow', name: '노랑', hex: '#BF8300' },
    { id: 'green', name: '초록', hex: '#16884A' },
    { id: 'purple', name: '보라', hex: '#7A34C9' },
    { id: 'orange', name: '주황', hex: '#D9530B' }
  ];
  var C = {};
  for (var ci = 0; ci < COLORS.length; ci++) { C[COLORS[ci].id] = COLORS[ci]; }

  /* ---------- levels ---------- */
  var LEVELS = [
    { id: 1, name: '색깔 3개', short: '3색', colors: ['red', 'blue', 'yellow'], count: 10, mission: 'ink' },
    { id: 2, name: '색깔 4개', short: '4색', colors: ['red', 'blue', 'yellow', 'green'], count: 10, mission: 'ink' },
    { id: 3, name: '색깔 5개', short: '5색', colors: ['red', 'blue', 'yellow', 'green', 'purple'], count: 12, mission: 'ink', speed: true },
    { id: 4, name: '미션 반전!', short: '반전', colors: ['red', 'blue', 'yellow', 'green', 'purple'], count: 12, mission: 'mixed', speed: true },
    { id: 5, name: '버튼 섞기', short: '섞기', colors: ['red', 'blue', 'yellow', 'green', 'purple', 'orange'], count: 15, mission: 'mixed', speed: true, shuffle: true },
    { id: 6, name: '눈치왕 30초!', short: '30초', colors: ['red', 'blue', 'yellow', 'green', 'purple', 'orange'], count: 0, mission: 'mixed', speed: true, time: 30000 }
  ];

  var MISMATCH = 0.86;        /* how often the word and its paint disagree */
  var MISSION_RUN_MAX = 2;    /* same mission at most twice in a row */
  var TIME_ATTACK_SEC = 30;
  var STORE = 'wangjeonNunchi.v1';
  var PRAISE = ['정답! 눈치 빠르다!', '딱 맞았어요!', '완벽해요!', '눈치왕이에요!', '최고예요!', '와, 정답!'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function shufflePick(list) { return list[Math.floor(rnd() * list.length)]; }

  /* ---------- rng (seedable so the rules can be tested) ---------- */
  var rngState = 1;
  function seedRng(s) { rngState = (s >>> 0) || 1; }
  function rnd() {
    rngState = (rngState + 0x6D2B79F5) >>> 0;
    var t = rngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function pickOther(ids, not) {
    var options = [], i;
    for (i = 0; i < ids.length; i++) { if (ids[i] !== not) { options.push(ids[i]); } }
    if (!options.length) { return ids[0]; }
    return shufflePick(options);
  }

  /* ---------- problem rules ---------- */
  function newMissionState() { return { last: null, run: 0 }; }

  function pickMission(level, ms) {
    if (!ms) { ms = newMissionState(); }
    if (level.mission !== 'mixed') {
      ms.last = 'ink'; ms.run = 0;
      return 'ink';
    }
    var m;
    if (ms.last === 'ink' && ms.run >= MISSION_RUN_MAX) { m = 'word'; }
    else if (ms.last === 'word' && ms.run >= MISSION_RUN_MAX) { m = 'ink'; }
    else { m = rnd() < 0.5 ? 'ink' : 'word'; }
    if (m === ms.last) { ms.run++; } else { ms.last = m; ms.run = 1; }
    return m;
  }

  function makeSpec(level, prev, ms) {
    var ids = level.colors, mission = pickMission(level, ms), word, ink, guard = 0;
    do {
      word = shufflePick(ids);
      ink = (rnd() < MISMATCH) ? pickOther(ids, word) : word;
      guard++;
    } while (prev && word === prev.word && ink === prev.ink && mission === prev.mission && guard < 60);
    return { word: word, ink: ink, mission: mission };
  }

  function answerOf(spec) { return spec.mission === 'ink' ? spec.ink : spec.word; }

  function answerOrder(level, idx, prevOrder) {
    var order = prevOrder ? prevOrder.slice() : level.colors.slice();
    if (!prevOrder) { return order; }
    if (level.shuffle && idx > 0 && idx % 3 === 0 && order.length > 1) {
      var a = Math.floor(rnd() * order.length);
      var b = Math.floor(rnd() * (order.length - 1));
      if (b >= a) { b++; }
      var t = order[a]; order[a] = order[b]; order[b] = t;
    }
    return order;
  }

  /* ---------- sound ---------- */
  var actx = null, audioUnlocked = false;
  function audio() {
    if (!audioUnlocked) { return null; }
    if (!actx) {
      var A = window.AudioContext || window.webkitAudioContext;
      if (!A) { return null; }
      try { actx = new A(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { actx.resume(); }
    return actx;
  }
  function beep(freq, delay, dur, type, vol) {
    var c = audio(); if (!c) { return; }
    var t0 = c.currentTime + delay;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.15 : vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function sfx(kind) {
    if (save.muted || !audioUnlocked) { return; }
    if (kind === 'ok') { beep(880, 0, 0.13, 'sine', 0.14); beep(1175, 0.08, 0.2, 'sine', 0.13); }
    else if (kind === 'combo') { beep(1047, 0, 0.1, 'triangle', 0.12); beep(1319, 0.08, 0.1, 'triangle', 0.12); beep(1568, 0.17, 0.16, 'triangle', 0.11); }
    else if (kind === 'no') { beep(392, 0, 0.12, 'sine', 0.14); beep(262, 0.1, 0.22, 'sine', 0.13); }
    else if (kind === 'tap') { beep(700, 0, 0.05, 'triangle', 0.06); }
    else if (kind === 'win') { beep(523, 0, 0.18, 'sine', 0.13); beep(659, 0.1, 0.18, 'sine', 0.13); beep(784, 0.2, 0.18, 'sine', 0.13); beep(1047, 0.3, 0.32, 'sine', 0.12); }
  }

  /* ---------- state ---------- */
  var S = {
    level: 1, idx: 0, total: 10, spec: null, prevSpec: null, missionState: newMissionState(),
    order: [], correct: 0, wrong: 0, score: 0, streak: 0, bestStreak: 0,
    rts: [], shownAt: 0, phase: 'play', paused: false, round: 0,
    timeLimit: 0, timeLeft: 0, lastTick: 0, timer: null,
    missionChanged: false, newRecord: false, reason: '', answered: 0
  };
  var save = { best: {}, muted: false, lastLevel: 1 };
  var answerButtons = [];

  function readStore() {
    try { var raw = localStorage.getItem(STORE); if (raw) { return JSON.parse(raw) || {}; } } catch (e) {}
    return {};
  }
  function writeStore() {
    try { localStorage.setItem(STORE, JSON.stringify(save)); } catch (e) {}
  }

  /* ---------- render helpers ---------- */
  function setMood(m) { $('mascots').setAttribute('data-mood', m); }

  function feedback(text, kind) {
    var f = $('feedback');
    f.textContent = text || '';
    f.className = 'feedback' + (kind ? ' ' + kind : '');
  }

  function popCard() {
    var c = $('card');
    c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    setTimeout(function () { c.classList.remove('pop'); }, 400);
  }
  function shakeCard() {
    var c = $('card');
    c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    setTimeout(function () { c.classList.remove('shake'); }, 460);
  }

  function renderMission(spec, animate) {
    var badge = $('missionBadge');
    var isInk = spec.mission === 'ink';
    badge.className = 'mission ' + (isInk ? 'm-ink' : 'm-word') + (animate ? ' flip' : '');
    $('missionIcon').textContent = isInk ? '🎨' : '🔤';
    $('missionText').textContent = isInk ? '글씨 색깔 고르기!' : '적힌 글자 고르기!';
    $('missionSub').textContent = isInk ? '글자가 칠해진 색을 골라요' : '글자가 말하는 색을 골라요';
  }

  function renderStatus() {
    var v1 = $('stVal1'), v2 = $('stVal2'), v3 = $('stVal3');
    if (S.timeLimit) {
      $('stLbl1').textContent = '남은 시간';
      v1.textContent = (Math.max(0, S.timeLeft) / 1000).toFixed(1) + '초';
      v1.className = S.timeLeft <= 10000 ? 'low' : '';
    } else {
      $('stLbl1').textContent = '문제';
      v1.textContent = Math.min(S.idx + 1, S.total) + '/' + S.total;
      v1.className = '';
    }
    v2.textContent = fmt(S.score) + '점';
    v3.textContent = S.streak > 0 ? '🔥' + S.streak + '연속' : '—';
    v3.className = S.streak >= 3 ? 'hot' : '';
  }

  function renderProgress() {
    var fill = $('progFill');
    if (S.timeLimit) {
      var ratio = Math.max(0, Math.min(1, S.timeLeft / S.timeLimit));
      fill.className = 'time' + (S.timeLeft <= 8000 ? ' low' : '');
      fill.style.width = (ratio * 100).toFixed(1) + '%';
    } else {
      fill.className = '';
      var done = Math.min(S.idx, S.total);
      fill.style.width = (S.total ? (done / S.total) * 100 : 0).toFixed(1) + '%';
    }
  }

  function renderPrompt() {
    var w = $('promptWord');
    w.textContent = C[S.spec.word].name;
    w.className = 'promptword c-' + S.spec.ink;
  }

  function renderAnswers(level) {
    var box = $('answers'), i, b, id, col;
    box.innerHTML = '';
    answerButtons = [];
    var cols = level.colors.length <= 3 ? level.colors.length : 2;
    box.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
    for (i = 0; i < S.order.length; i++) {
      id = S.order[i];
      col = C[id];
      b = document.createElement('button');
      b.type = 'button';
      b.className = 'ansbtn';
      b.setAttribute('data-color', id);
      b.setAttribute('aria-label', col.name + ' 고르기');
      b.innerHTML = '<span class="chip" style="background:' + col.hex + '"></span><span class="aname">' + col.name + '</span>';
      b.addEventListener('click', onAnswerClick);
      box.appendChild(b);
      answerButtons.push(b);
    }
  }

  function updateTabs() {
    var bar = $('tabs'), i, tab, lv, st;
    for (i = 0; i < bar.children.length; i++) {
      tab = bar.children[i];
      lv = parseInt(tab.getAttribute('data-level'), 10);
      if (lv === S.level) { tab.classList.add('active'); } else { tab.classList.remove('active'); }
      st = (save.best && save.best[lv] && save.best[lv].stars) ? save.best[lv].stars : 0;
      if (tab.__mark) { tab.__mark.textContent = st >= 3 ? '♛' : (st >= 1 ? '★' : ''); }
    }
  }

  function buildTabs() {
    var bar = $('tabs'), i, lv, b, mark;
    if (bar.children.length) { return; }
    for (i = 0; i < LEVELS.length; i++) {
      lv = LEVELS[i];
      b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.setAttribute('data-level', String(lv.id));
      b.setAttribute('aria-label', lv.id + '단계 ' + lv.name);
      b.innerHTML = '<span class="tn">' + lv.id + '</span><span class="tl">' + lv.short + '</span>';
      mark = document.createElement('span');
      mark.className = 'mark';
      b.__mark = mark;
      b.appendChild(mark);
      bar.appendChild(b);
    }
    bar.addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== bar && !(t.getAttribute && t.getAttribute('data-level'))) { t = t.parentNode; }
      if (!t || t === bar) { return; }
      startLevel(parseInt(t.getAttribute('data-level'), 10));
    });
  }

  /* ---------- round flow ---------- */
  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

  function startTimer() {
    stopTimer();
    if (!S.timeLimit) { return; }
    S.lastTick = Date.now();
    S.timer = setInterval(function () {
      if (S.phase !== 'play' || S.paused) { return; }
      var now = Date.now();
      var dt = now - S.lastTick;
      S.lastTick = now;
      stepClock(dt);
    }, 100);
  }

  function stepClock(dt) {
    if (!S.timeLimit || S.phase === 'result' || S.paused) { return; }
    S.timeLeft -= dt;
    if (S.timeLeft <= 0) {
      S.timeLeft = 0;
      renderStatus(); renderProgress();
      finish('time');
      return;
    }
    renderStatus(); renderProgress();
  }

  function showProblem() {
    var level = LEVELS[S.level - 1];
    S.spec = makeSpec(level, S.prevSpec, S.missionState);
    S.missionChanged = !!(S.prevSpec && S.prevSpec.mission !== S.spec.mission);
    S.order = answerOrder(level, S.idx, S.idx === 0 ? null : S.order);
    S.phase = 'play';
    S.shownAt = Date.now();
    renderMission(S.spec, S.missionChanged);
    renderPrompt();
    renderAnswers(level);
    renderStatus();
    renderProgress();
    feedback('', '');
    setMood(S.missionChanged ? 'confused' : 'idle');
    if (S.missionChanged) {
      toast('미션이 바뀌었어요! ' + (S.spec.mission === 'ink' ? '🎨 글씨 색깔' : '🔤 적힌 글자'));
    }
  }

  function startLevel(id) {
    stopTimer();
    var level = LEVELS[id - 1];
    if (!level) { return; }
    S.round++;
    S.level = id;
    S.idx = 0;
    S.total = level.count;
    S.correct = 0; S.wrong = 0; S.score = 0; S.streak = 0; S.bestStreak = 0; S.answered = 0;
    S.rts = [];
    S.prevSpec = null;
    S.missionState = newMissionState();
    S.order = [];
    S.paused = false;
    S.phase = 'play';
    S.reason = ''; S.newRecord = false;
    S.timeLimit = level.time || 0;
    S.timeLeft = S.timeLimit;
    $('pauseMask').hidden = true;
    $('resultView').hidden = true;
    $('playView').hidden = false;
    showProblem();
    updateTabs();
    save.lastLevel = id;
    writeStore();
    startTimer();
    if (id === 6) { toast('30초 안에 최대한 많이 맞혀 봐요!'); }
  }

  function nextProblem() {
    if (S.phase === 'result') { return; }
    S.idx++;
    if (S.total && S.idx >= S.total) { finish('done'); return; }
    S.prevSpec = S.spec;
    showProblem();
  }

  function onAnswerClick() {
    answer(this.getAttribute('data-color'));
  }

  function answer(colorId) {
    if (S.phase !== 'play' || S.paused) { return; }
    var level = LEVELS[S.level - 1];
    var want = answerOf(S.spec);
    var ms = Math.max(0, Date.now() - S.shownAt);
    var ok = colorId === want;
    var token = S.round;
    var i, b;

    S.answered++;
    S.rts.push(ms);
    S.phase = 'feedback';

    for (i = 0; i < answerButtons.length; i++) {
      b = answerButtons[i];
      b.setAttribute('disabled', 'disabled');
      if (b.getAttribute('data-color') === colorId) { b.classList.add(ok ? 'ok' : 'no'); }
      if (!ok && b.getAttribute('data-color') === want) { b.classList.add('reveal'); }
    }

    if (ok) {
      S.correct++;
      S.streak++;
      if (S.streak > S.bestStreak) { S.bestStreak = S.streak; }
      var comboBonus = Math.min(S.streak - 1, 5) * 20;
      var speed = level.speed ? Math.max(0, Math.min(80, Math.round((2600 - ms) / 26))) : 0;
      var gained = 100 + comboBonus + speed;
      S.score += gained;
      feedback(PRAISE[Math.floor(rnd() * PRAISE.length)] + ' +' + gained, 'ok');
      setMood('happy');
      popCard();
      spark(14);
      sfx('ok');
      if (S.streak >= 2 && S.streak % 3 === 0) { sfx('combo'); }
      if (S.streak >= 3) { feedback('🔥 ' + S.streak + '연속! +' + gained, 'ok'); }
      renderStatus();
      setTimeout(function () {
        if (token !== S.round || S.phase !== 'feedback') { return; }
        nextProblem();
      }, 520);
    } else {
      S.wrong++;
      S.streak = 0;
      feedback('아쉬워요! 정답은 ‘' + C[want].name + '’ — ' + (S.spec.mission === 'ink' ? '칠해진 색' : '적힌 글자') + '이에요', 'bad');
      setMood('sad');
      shakeCard();
      sfx('no');
      renderStatus();
      setTimeout(function () {
        if (token !== S.round || S.phase !== 'feedback') { return; }
        nextProblem();
      }, 1150);
    }
  }

  /* ---------- finish ---------- */
  function starsFor() {
    if (S.timeLimit) {
      if (S.correct >= 20) { return 3; }
      if (S.correct >= 14) { return 2; }
      if (S.correct >= 9) { return 1; }
      return 0;
    }
    var ratio = S.total ? S.correct / S.total : 0;
    if (ratio >= 0.9) { return 3; }
    if (ratio >= 0.7) { return 2; }
    if (ratio >= 0.5) { return 1; }
    return 0;
  }

  function finish(reason) {
    if (S.phase === 'result') { return; }
    stopTimer();
    S.phase = 'result';
    S.reason = reason;
    var stars = starsFor();
    save.best = save.best || {};
    var b = save.best[S.level] || { score: 0, stars: 0 };
    S.newRecord = S.score > (b.score || 0);
    if (S.score > (b.score || 0)) { b.score = S.score; }
    if (stars > (b.stars || 0)) { b.stars = stars; }
    save.best[S.level] = b;
    writeStore();
    updateTabs();
    renderResult(stars);
    if (stars > 0) { spark(30); sfx('win'); } else { sfx('no'); }
  }

  function renderResult(stars) {
    var level = LEVELS[S.level - 1];
    var titles = ['다시 도전해 볼까요?', '조금만 더 힘내요!', '눈치가 빨라요!', '눈치왕 등극!'];
    $('playView').hidden = true;
    $('resultView').hidden = false;
    $('resultTitle').textContent = titles[stars];
    $('resultSub').textContent = S.level + '단계 · ' + level.name + (S.reason === 'time' ? ' · 시간 종료' : '');
    var st = $('resultStars'), i, txt = '';
    for (i = 0; i < 3; i++) { txt += '<i class="' + (i < stars ? 'on' : 'off') + '">★</i>'; }
    st.innerHTML = txt;
    $('rScore').textContent = fmt(S.score) + '점';
    $('rAcc').textContent = S.correct + '/' + S.answered + (S.answered ? ' (' + Math.round(S.correct / S.answered * 100) + '%)' : '');
    $('rCombo').textContent = S.bestStreak + '연속';
    var avg = 0, k;
    for (k = 0; k < S.rts.length; k++) { avg += S.rts[k]; }
    avg = S.rts.length ? avg / S.rts.length : 0;
    $('rRT').textContent = (avg / 1000).toFixed(2) + '초';
    var best = (save.best && save.best[S.level]) || { score: 0 };
    $('rBest').innerHTML = '최고 기록 ' + fmt(best.score || 0) + '점' +
      (S.newRecord ? '<span class="new">새 기록!</span>' : '');
    var last = S.level >= LEVELS.length;
    $('nextBtn').hidden = last;
    $('nextBtn').textContent = '다음 단계';
    $('retryBtn').textContent = '다시 도전';
    $('btnRow').className = 'btnrow' + (last ? ' solo' : '');
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- fx ---------- */
  function spark(n) {
    var fx = $('fx'), colors = ['#ffd257', '#ffa8c0', '#ff8e72', '#c9b6ff', '#ffe9a3', '#ffffff'];
    var w = (window.innerWidth || 390), h = (window.innerHeight || 800), i, s;
    for (i = 0; i < n; i++) {
      s = document.createElement('span');
      s.className = 'spark';
      s.style.left = Math.round(w / 2 + (Math.random() * 190 - 95)) + 'px';
      s.style.top = Math.round(h * 0.32 + Math.random() * 40) + 'px';
      s.style.background = colors[i % colors.length];
      if (s.style.setProperty) { s.style.setProperty('--dx', Math.round(Math.random() * 240 - 120) + 'px'); }
      s.style.animationDuration = (0.9 + Math.random() * 0.7).toFixed(2) + 's';
      s.style.animationDelay = (Math.random() * 0.16).toFixed(2) + 's';
      if (i % 3 === 0) { s.style.borderRadius = '50%'; }
      fx.appendChild(s);
      (function (el) {
        setTimeout(function () { if (el.parentNode) { el.parentNode.removeChild(el); } }, 2000);
      })(s);
    }
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { t.hidden = true; }, 2400);
  }

  /* ---------- share ---------- */
  function copyLink(url) {
    function done(ok) {
      toast(ok ? '링크를 복사했어요! 친구에게 붙여넣기 해 주세요.' : '주소창의 주소를 복사해 주세요: ' + url);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      if (ta.select) { ta.select(); }
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { done(true); }, fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }
  function shareGame() {
    var url = location.href.split('#')[0];
    var payload = {
      title: '♡왕전초 눈치왕!♡',
      text: '색깔 이름에 속지 마세요! 글씨 색깔과 적힌 글자를 눈치 있게 골라 내는 게임이에요.',
      url: url
    };
    if (navigator.share) {
      try {
        navigator.share(payload)['catch'](function () { copyLink(url); });
        return;
      } catch (e) {}
    }
    copyLink(url);
  }

  /* ---------- pause ---------- */
  function setPaused(on) {
    if (S.phase !== 'play') { return; }
    S.paused = !!on;
    $('pauseMask').hidden = !S.paused;
    if (!S.paused) { S.lastTick = Date.now(); S.shownAt = Date.now(); }
  }

  /* ---------- manifest ---------- */
  function setupManifest() {
    var link = $('manifestLink');
    var icon = document.querySelector ? document.querySelector('link[rel="apple-touch-icon"]') : null;
    var href = icon ? icon.getAttribute('href') : '';
    var mf = {
      name: '♡왕전초 눈치왕!♡', short_name: '눈치왕',
      description: '글씨 색깔과 적힌 글자에 속지 않고 골라 내는 색깔 눈치 게임',
      start_url: '.', scope: '.', display: 'standalone', orientation: 'portrait',
      background_color: '#fff7f9', theme_color: '#ff7d97',
      icons: [{ src: href, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    try {
      link.setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mf)));
    } catch (e) {}
  }

  function applyMute() {
    $('sndOnIcon').style.display = save.muted ? 'none' : '';
    $('sndOffIcon').style.display = save.muted ? '' : 'none';
    $('sndBtn').className = 'iconbtn' + (save.muted ? ' off' : '');
    $('sndBtn').setAttribute('aria-label', save.muted ? '효과음 켜기' : '효과음 끄기');
  }

  /* ---------- events ---------- */
  function bind() {
    $('retryBtn').addEventListener('click', function () { sfx('tap'); startLevel(S.level); });
    $('nextBtn').addEventListener('click', function () {
      sfx('tap');
      startLevel(Math.min(LEVELS.length, S.level + 1));
    });
    $('shareBtn').addEventListener('click', shareGame);
    $('sndBtn').addEventListener('click', function () {
      audioUnlocked = true;
      save.muted = !save.muted;
      writeStore();
      applyMute();
      toast(save.muted ? '효과음을 껐어요' : '효과음을 켰어요');
      if (!save.muted) { sfx('tap'); }
    });
    $('pauseBtn').addEventListener('click', function () { setPaused(true); });
    $('resumeBtn').addEventListener('click', function () { setPaused(false); });
    document.addEventListener('keydown', function (e) {
      if (!e || !e.key) { return; }
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9 && S.phase === 'play' && !S.paused) {
        var b = answerButtons[n - 1];
        if (b) { answer(b.getAttribute('data-color')); }
      }
    });
    if (document.addEventListener) {
      document.addEventListener('pointerdown', function () { audioUnlocked = true; }, { once: true });
    }
  }

  function init() {
    var stored = readStore();
    save.best = stored.best || {};
    save.muted = !!stored.muted;
    save.lastLevel = stored.lastLevel || 1;
    if (save.lastLevel < 1 || save.lastLevel > LEVELS.length) { save.lastLevel = 1; }
    seedRng((Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0);
    applyMute();
    buildTabs();
    bind();
    setupManifest();
    startLevel(save.lastLevel);
  }

  /* ---------- test hook ---------- */
  window.__nunchi = {
    COLORS: COLORS, LEVELS: LEVELS, state: S, save: save,
    setSeed: seedRng, rnd: rnd,
    newMissionState: newMissionState, pickMission: pickMission, makeSpec: makeSpec,
    answerOf: answerOf, answerOrder: answerOrder,
    startLevel: startLevel, answer: answer, nextProblem: nextProblem,
    stepClock: stepClock, finish: finish, starsFor: starsFor,
    renderMission: renderMission, renderStatus: renderStatus, renderProgress: renderProgress,
    renderResult: renderResult, currentAnswerId: function () { return S.spec ? answerOf(S.spec) : null; },
    buttons: function () { return answerButtons; }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
